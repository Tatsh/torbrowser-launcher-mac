concurrency:
  cancel-in-progress: true
  group: '${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}'
jobs:
  analyze:
    name: 'Analyze'
    permissions:
      actions: 'read'
      contents: 'read'
      security-events: 'write'
    runs-on: 'macos-latest'
    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          persist-credentials: false
      - name: 'Initialize CodeQL'
        uses: 'github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d'
        with:
          languages: '${{ matrix.language }}'
      - name: Build
        run: |
          cmake -G Xcode -B build -DCMAKE_BUILD_TYPE=Debug \
            --install-prefix "${GITHUB_WORKSPACE}/build/prefix" \
            -DCMAKE_APPLE_SILICON_PROCESSOR=arm64
          cmake --build build --config Debug --verbose
      - name: 'Perform CodeQL Analysis'
        uses: 'github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d'
        with:
          category: '/language:${{matrix.language}}'
    strategy:
      fail-fast: false
      matrix:
        language: ['swift']
name: 'CodeQL'
'on':
  pull_request:
    branches:
      - 'master'
  push:
    branches:
      - 'master'
  schedule:
    - cron: '15 4 * * 3'
permissions: {}
