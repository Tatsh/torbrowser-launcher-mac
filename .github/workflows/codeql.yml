jobs:
  analyze:
    name: 'Analyze'
    permissions:
      actions: 'read'
      contents: 'read'
      security-events: 'write'
    runs-on: 'macos-latest'
    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          persist-credentials: false
      - name: 'Initialize CodeQL'
        uses: 'github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938'
        with:
          languages: '${{ matrix.language }}'
      - name: Build
        run: |
          cmake -G Xcode -B build -DCMAKE_BUILD_TYPE=Debug \
            --install-prefix ${{github.workspace}}/build/prefix \
            -DCMAKE_APPLE_SILICON_PROCESSOR=arm64
          cmake --build build --config Debug --verbose
      - name: 'Perform CodeQL Analysis'
        uses: 'github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938'
        with:
          category: '/language:${{matrix.language}}'
    strategy:
      fail-fast: false
      matrix:
        language: ['swift']
name: 'CodeQL'
'on':
  pull_request:
    branches:
      - 'master'
  push:
    branches:
      - 'master'
  schedule:
    - cron: '15 4 * * 3'
